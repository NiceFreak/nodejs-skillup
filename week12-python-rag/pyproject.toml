[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "week12-python-baseline"
version = "0.1.0"
description = "W12 Python for AI Engineering baseline: TS -> Python migration increments"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

# ========== 新增：覆盖率配置 ==========
[tool.coverage.run]
source = ["src"]
omit = [
    "src/smoke.py",
    "src/users/unit5_demo.py",
    "src/users/unit7_context.py",
]

# ========== 修改：addopts 增加覆盖率参数 ==========
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
