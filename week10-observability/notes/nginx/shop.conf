# Nginx 80 site — W10 D2 副本（2026-08-18）
# 改动：3 个反代 location 各加 proxy_set_header X-Request-Id（P1 选 a：九处逐个加，不依赖继承语义）
# 服务器回滚基线：/etc/nginx/sites-available/shop.bak.20260818
server {
    listen 80;
    server_name 43.128.154.242;

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /reports {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        return 404;
    }
}