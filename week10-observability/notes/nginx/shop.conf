# Nginx 80 site — W10 D2 副本（2026-08-18）
# 改动：3 个反代 location 各加 proxy_set_header X-Request-Id（P1 选 a：九处逐个加，不依赖继承语义）
# 服务器回滚基线：/etc/nginx/sites-available/shop.bak.20260818
#
# 2026-08-26 追加（状态：已落盘 2026-08-27，nginx -t + reload 通过）
# 改动：加 location /showcase/ —— 把 8081 那份 dist-showcase 以 80 子路径再挂一个入口
# 起因：Claude Code 云端会话的出网网关只放行 80/443，8081 直连超时（实测 8080/8081/3000/22 全部 timeout）
# 前提：showcase 构建 base 为空串（vite.config.ts: BASE = SHOWCASE ? "" : "/admin/"），
#       产物资源是相对路径引用，因此可挂任意子路径，无需重新构建
# 回滚基线：/etc/nginx/sites-available/shop.bak.20260827
server {
    listen 80;
    server_name 43.128.154.242;

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /reports {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # 无尾斜杠会让产物里的相对路径资源少解析一层目录，301 补齐后再交给下面的 alias
    location = /showcase {
        return 301 /showcase/;
    }

    # alias 读盘（不同于本文件其余 location 的 proxy_pass 只转发），
    # 受 /home/nodeapp 的 other 执行位影响——W9 D4-b B3 的 403 就是这条
    location /showcase/ {
        alias /home/nodeapp/nodejs-skillup/week8-fullstack/src/frontend/dist-showcase/;
        # server 级无 index 指令（80 站原本纯反代不读盘），不写这行访问 /showcase/ 取不到入口文件
        index index.html;
    }

    location / {
        return 404;
    }
}
