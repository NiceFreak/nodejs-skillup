# Nginx 443 HTTPS site — W10 D2 副本（2026-08-18）
# 改动：3 个反代 location（= /、/auth、/reports）各加 proxy_set_header X-Request-Id
# /admin/ 是静态 alias location，不加 proxy_set_header
# 服务器回滚基线：/etc/nginx/sites-available/shop-ssl.bak.20260818
server {
    listen 443 ssl;
    server_name 43-128-154-242.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/43-128-154-242.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43-128-154-242.sslip.io/privkey.pem;

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # admin 管理后台（443 子路径，alias 静态）
    location /admin/ {
        alias /home/nodeapp/nodejs-skillup/week8-fullstack/src/frontend/dist-admin443/;
        index index.html;
    }

    location /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /reports {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        return 404;
    }
}