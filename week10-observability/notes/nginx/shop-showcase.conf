# Nginx 8081 site — W10 D2 副本（2026-08-18）
# 改动：1 个反代 location（/auth）加 proxy_set_header X-Request-Id
# location / 是静态 root，不加 proxy_set_header
# 服务器回滚基线：/etc/nginx/sites-available/shop-showcase.bak.20260818
server {
    listen 8081;
    server_name 43.128.154.242;

    root /home/nodeapp/nodejs-skillup/week8-fullstack/src/frontend/dist-showcase;
    index index.html;

    location /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        # 静态文件；文件不存在 → Nginx 404（hash 路由无需 try_files）
    }
}