# Nginx 443 HTTPS site — W9 D4-HTTPS 部署产物（2026-08-13）
# 与 shop（80）同一白名单语义：location = /、/auth、/reports 反代 3000 + 兜底 404
# 证书：certbot certonly 签发，路径由 certbot 生成
server {
    listen 443 ssl;
    server_name 43-128-154-242.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/43-128-154-242.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43-128-154-242.sslip.io/privkey.pem;

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /reports {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}